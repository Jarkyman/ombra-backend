<style>
  html, body { margin: 0; padding: 0; height: 100%; }

  ::-webkit-scrollbar-thumb { background: rgba(128,120,112,0.3); border-radius: 4px; }
  @keyframes pulse-badge { 0%,100%{opacity:1} 50%{opacity:.55} }
  @keyframes slide-up { from{transform:translateY(6px);opacity:0} to{transform:translateY(0);opacity:1} }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
