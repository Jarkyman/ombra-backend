<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ombra — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(128,120,112,0.3); border-radius: 4px; }
  @keyframes pulse-badge {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/tokens.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="admin/sidebar.jsx"></script>
<script type="text/babel" src="admin/dashboard.jsx"></script>
<script type="text/babel" src="admin/hardware.jsx"></script>
<script type="text/babel" src="admin/logs.jsx"></script>
<script type="text/babel" src="admin/memory.jsx"></script>
<script type="text/babel" src="admin/entity-graph.jsx"></script>
<script type="text/babel" src="admin/sections.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "layout": "default",
  "density": "compact"
}/*EDITMODE-END*/;

const SECTION_COMPONENTS = {
  dashboard: (tok, dark) => <DashboardContent tok={tok} dark={dark} />,
  logs:      (tok, dark) => <LogsContent      tok={tok} dark={dark} />,
  memory:    (tok, dark) => <MemoryContent    tok={tok} dark={dark} />,
  entities:  (tok, dark) => <EntitiesContent  tok={tok} dark={dark} />,
  hardware:  (tok, dark) => <HardwareContent  tok={tok} dark={dark} />,
  analytics: (tok, dark) => <AnalyticsContent tok={tok} dark={dark} />,
  config:    (tok, dark) => <ConfigContent    tok={tok} dark={dark} />,
  devices:   (tok, dark) => <DevicesContent   tok={tok} dark={dark} />,
  profile:   (tok, dark) => <ProfileContent   tok={tok} dark={dark} />,
  trash:     (tok, dark) => <TrashContent     tok={tok} dark={dark} />,
};

function AdminApp() {
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const [dark, setDark]           = useState(systemDark);
  const [section, setSection]     = useState('dashboard');
  const [collapsed, setCollapsed] = useState(false);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const tok     = dark ? OMBRA_DARK : OMBRA_LIGHT;
  const layout  = tweaks.layout;
  const pad     = tweaks.density === 'compact' ? 20 : 32;

  const renderSection = SECTION_COMPONENTS[section];

  return (
    <div style={{
      display: 'flex', height: '100vh', overflow: 'hidden',
      background: tok.canvas, color: tok.textPrimary,
      fontFamily: SANS, WebkitFontSmoothing: 'antialiased',
    }}>
      <AdminSidebar
        tok={tok} dark={dark}
        active={section}
        onNav={setSection}
        collapsed={collapsed}
        onToggle={() => setCollapsed(c => !c)}
        onTheme={() => setDark(d => !d)}
        layout={layout}
      />

      <div style={{
        flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden',
        ...(layout === 'floating' ? { margin: '12px 12px 12px 0' } : {}),
      }}>
        <AdminHeader tok={tok} section={section} />
        <div style={{ flex: 1, overflow: 'auto', padding: `${pad}px`, background: tok.canvas }}>
          {renderSection(tok, dark)}
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Layout">
          <TweakRadio
            label="Sidebar"
            value={tweaks.layout}
            options={[
              { value: 'default',  label: 'Default'  },
              { value: 'floating', label: 'Floating' },
            ]}
            onChange={v => setTweak('layout', v)}
          />
          <TweakRadio
            label="Density"
            value={tweaks.density}
            options={[
              { value: 'comfortable', label: 'Comfortable' },
              { value: 'compact',     label: 'Compact'     },
            ]}
            onChange={v => setTweak('density', v)}
          />
        </TweakSection>
        <TweakSection label="Section">
          <TweakSelect
            label="Navigate to"
            value={section}
            options={ADMIN_NAV.filter(n => n !== 'divider').map(n => ({ value: n.id, label: n.label }))}
            onChange={v => setSection(v)}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
</script>
</body>
</html>
